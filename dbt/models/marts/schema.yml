version: 2

models:
  - name: dim_teams
    description: Team dimension at team-season grain (one row per team per season).
    columns:
      - name: team_season_key
        description: Surrogate key, team_id + season.
        tests:
          - unique
          - not_null
      - name: team_id
        description: CFBD team id.
        tests:
          - not_null
      - name: season
        tests:
          - not_null

  - name: dim_games
    description: Game dimension, one row per game.
    columns:
      - name: game_id
        description: CFBD game id (primary key).
        tests:
          - unique
          - not_null

  - name: fact_game_stats
    description: >
      Team game stats at game-team grain (one row per team per game), scoped to
      FBS-vs-FBS games.
    columns:
      - name: game_team_key
        description: Surrogate key, game_id + team_id.
        tests:
          - unique
          - not_null
      - name: game_id
        description: Foreign key to dim_games.
        tests:
          - not_null
          - relationships:
              to: ref('dim_games')
              field: game_id
      - name: team_id
        description: Foreign key to dim_teams (FBS teams).
        tests:
          - not_null
          - relationships:
              to: ref('dim_teams')
              field: team_id
      - name: home_away
        tests:
          - accepted_values:
              values: ['home', 'away']
