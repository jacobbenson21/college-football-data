name: 'cfb'
version: '1.0.0'
config-version: 2

profile: 'cfb'

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  cfb:
    staging:
      +materialized: view
      +schema: STAGING
    marts:
      +materialized: table
      +schema: ANALYTICS
